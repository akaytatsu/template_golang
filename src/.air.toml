# Config file for [Air](https://github.com/air-verse/air) in TOML format

# Working directory
# . or absolute path, please note that the directories following must be under root.
root = "."
tmp_dir = "tmp"

[build]
# Sem `-tags musl`: a imagem de dev é Debian/glibc, e a tag musl seleciona
# librdkafka_musl_*.a, cujo link contra glibc falha em `strlcpy`/`sigsetjmp`.
# Sem tags, o confluent-kafka-go usa a librdkafka estática glibc que ele já
# vendora. (`-tags dynamic` também não serve: a librdkafka-dev do bookworm é
# anterior à v2.15.0 exigida pelo driver.)
cmd = "go build -o ./tmp/main ."
# Binary file yields from `cmd`.
bin = "tmp/main"

# Polling em vez de eventos: bind mounts do Docker no macOS/Windows não
# propagam eventos de inotify de forma confiável.
poll = true

# Customize binary - sem debug por padrão para performance
full_bin = "./tmp/main"

# Watch these filename extensions.
include_ext = ["go"]

# Ignore these filename extensions or directories.
exclude_dir = [".git", "tmp", "vendor", ".docker", "logs"]

# Watch these directories if you specified.
include_dir = []

# Exclude files.
exclude_file = []

# Aumentar delay para evitar rebuilds excessivos
delay = 2000 # ms

# Stop to run old binary when build errors occur.
stop_on_error = true

# Logs location
log = "logs/air_errors.log"

[log]
# Show log time
time = false

[color]
# Customize each part's color. If no color is found, use the raw app log.
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
# Delete tmp directory on exit
clean_on_exit = true
